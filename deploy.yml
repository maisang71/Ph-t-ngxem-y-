name: Deploy Website to GitHub Pages

on:
  # Tự động chạy khi bạn push code lên nhánh chính (main)
  push:
    branches: [ "main" ] # Hoặc "master" tùy thuộc vào nhánh của bạn

  # Cho phép chạy thủ công trực tiếp từ tab Actions trên GitHub
  workflow_dispatch:

# Quyền hạn cần thiết để GitHub Pages đọc và ghi deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép một tiến trình deploy chạy đồng thời tránh xung đột
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Thư mục chứa mã nguồn website (file index.html nằm ở thư mục gốc)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
